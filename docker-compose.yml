services:
  nginx:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
      - python-ai

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]

  backend:
    image: php:8.4-fpm
    working_dir: /var/www/html
    volumes:
      - ./apps/backend/laravel-api:/var/www/html
    environment:
      - APP_ENV=local
    depends_on:
      - mysql
      - redis

  python-ai:
    image: python:3.11-slim
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend/python-ai:/app
    environment:
      - DATABASE_URL=mysql+pymysql://cyberiumshield:cyberiumshield@mysql:3306/cyberiumshield
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
      - DEBUG=true
    command: ["sh", "-c", "pip install -r requirements.txt && alembic upgrade head && uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  malware-classifier:
    image: python:3.11-slim
    working_dir: /app
    ports:
      - "5000:5000"
    volumes:
      - ./malware-detector:/app
    environment:
      - MALWARE_CORS_ORIGIN=http://localhost:5173
    command: ["sh", "-c", "pip install -r requirements.txt && python main.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phishing-detector:
    image: python:3.11-slim
    working_dir: /app
    ports:
      - "5001:5001"
    volumes:
      - ./phishing-detector:/app
    environment:
      - PHISHING_PORT=5001
    command: ["sh", "-c", "pip install -r requirements.txt && python app.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  email-spam-detector:
    image: python:3.11-slim
    working_dir: /app
    ports:
      - "5002:5002"
    volumes:
      - ./email-spam-detector:/app
    environment:
      - EMAIL_SPAM_PORT=5002
      - EMAIL_SPAM_CORS_ORIGIN=http://localhost:5173
    command: ["sh", "-c", "pip install -r requirements.txt && python app.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=cyberiumshield
      - MYSQL_USER=cyberiumshield
      - MYSQL_PASSWORD=cyberiumshield
      - MYSQL_ROOT_PASSWORD=cyberiumshield_root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "cyberiumshield", "-pcyberiumshield"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:

