server {
  listen 80;

  # Placeholder routing.
  # Replace upstream targets based on your final dev/prod build strategy.
  location / {
    proxy_pass http://frontend:5173;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # API routing
  location /api/ {
    proxy_pass http://python-ai:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Python AI routing
  location /ai/ {
    proxy_pass http://python-ai:8000/;
    proxy_set_header Host $host;
  }

  # Malware classifier routing
  location /malware-api/ {
    proxy_pass http://malware-classifier:5000/;
    proxy_set_header Host $host;
    client_max_body_size 100m;
  }

  # Phishing detector routing
  location /phishing-api/ {
    proxy_pass http://phishing-detector:5001/;
    proxy_set_header Host $host;
  }

  # Email spam detector routing
  location /email-spam-api/ {
    proxy_pass http://email-spam-detector:5002/;
    proxy_set_header Host $host;
  }

  # Network monitoring routing
  location /network-api/ {
    proxy_pass http://network-monitor:5003/;
    proxy_set_header Host $host;
  }

  # Vulnerability management routing
  location /vulnerability-api/ {
    proxy_pass http://vulnerability-manager:5004/;
    proxy_set_header Host $host;
  }

  # Threat intelligence routing
  location /threat-intelligence-api/ {
    proxy_pass http://threat-intelligence:5005/;
    proxy_set_header Host $host;
  }
}

